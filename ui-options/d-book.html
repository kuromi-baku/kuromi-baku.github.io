<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案D・文庫本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;overflow:hidden;background:#d9d4ca;font-family:'Songti TC','Songti SC','STSong',serif;color:#2b2622}
.book{position:fixed;inset:4vh 4vw;display:flex;background:#f6f1e6;box-shadow:0 1px 0 #bdb5a4,0 6px 0 #cfc8b8}
.left{position:relative;flex:0 0 46%;margin:26px 0 26px 26px;overflow:hidden;background:#222 center/cover;border:1px solid #2b2622}
.left img{position:absolute;bottom:-2%;left:50%;transform:translateX(-50%);height:100%;pointer-events:none}
.left .cap{position:absolute;left:0;right:0;bottom:0;padding:6px 12px;font-size:12px;letter-spacing:.3em;color:#f6f1e6;background:rgba(0,0,0,.55);text-align:center}
.spine{flex:0 0 1px;margin:18px 28px;background:#cfc7b4}
.right{position:relative;flex:1;padding:44px 40px 30px 0;display:flex;flex-direction:column}
.chap{font-size:13px;letter-spacing:.35em;color:#8a7f6c;border-bottom:1px solid #cfc7b4;padding-bottom:10px}
.body{flex:1;padding-top:34px;font-size:clamp(17px,1.9vw,21px);line-height:2.1;letter-spacing:.05em;cursor:pointer}
.body p{text-indent:2em;margin-bottom:.5em;color:#8a8070}
.body p:last-child{color:#2b2622}
.body .sp{color:#8b2f2f;text-indent:0;font-size:.82em;letter-spacing:.2em;display:block}
.opts{margin-top:10px;display:flex;flex-direction:column;gap:6px;border-top:1px solid #cfc7b4;padding-top:14px}
.opt{background:none;border:0;font:inherit;font-size:18px;line-height:1.7;text-align:left;color:#2b2622;cursor:pointer;padding:4px 0;border-bottom:1px dotted transparent}
.opt:hover{color:#8b2f2f;border-bottom-color:#8b2f2f}
.foot{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:#8a7f6c;padding-top:12px}
.back{position:fixed;left:6px;top:6px;font:12px sans-serif;color:#6a6355;text-decoration:none;z-index:9}
@media(max-width:760px){.book{flex-direction:column}.left{flex:0 0 36%;margin:20px 20px 0}.spine{display:none}.right{padding:20px}}
</style></head><body>
<a class="back" href="index.html">← 返回選擇</a>
<div class="book">
 <div class="left" id="left"><img id="face"><div class="cap" id="cap"></div></div>
 <div class="spine"></div>
 <div class="right">
  <div class="chap" id="chap"></div>
  <div class="body" id="body"></div>
  <div class="opts" id="opts"></div>
  <div class="foot"><span id="aff">— 緣分 0 —</span><span id="pg">1</span></div>
 </div>
</div>
<script src="story.js"></script>
<script>
const S=STORY,$=id=>document.getElementById(id);
$('left').style.backgroundImage=`url(${S.bg})`;$('chap').textContent=S.chapter;$('cap').textContent='圖一　'+S.name;
let opts=null,hist=[],pg=1;
function draw(){$('body').innerHTML=hist.slice(-4).map(h=>'<p>'+(h.speaker?'<span class="sp">'+h.speaker+'</span>':'')+h.text+'</p>').join('')}
const vn=createVN({
 face:s=>$('face').src=s,
 line:l=>{hist.push(l);pg++;$('pg').textContent=pg;draw()},
 choices:o=>{opts=o;const c=$('opts');c.innerHTML='';$('opts').style.display=o?'flex':'none';
  if(o)o.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b.textContent='（'+'一二三'[i]+'）'+x.t;b.onclick=()=>vn.choose(i,opts);c.appendChild(b)})},
 aff:(n,reset)=>{$('aff').textContent='— 緣分 '+n+' —';if(reset){hist=[];pg=1}}
});
$('opts').style.display='none';$('body').onclick=()=>vn.next();vn.start();
</script></body></html>
