<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案C・清新乙女手游</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;overflow:hidden;background:#fbeff0;font-family:'PingFang TC','Yuanti TC','Heiti TC',sans-serif;color:#5a4048}
.stage{position:fixed;inset:0;background:center/cover}
.stage:before{content:"";position:absolute;inset:0;background:rgba(255,244,246,.28)}
.stage img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:92%;pointer-events:none}
/* 顶部：扁平白卡片 + 实心粉色，不用发光、不用渐变 */
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border-radius:999px;padding:7px 16px;font-size:14px;box-shadow:0 2px 0 #f0cfd5}
.love{display:flex;align-items:center;gap:8px}
.bar{width:110px;height:10px;background:#f6dde1;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ec7f95;border-radius:9px;transition:width .4s}
.round{width:36px;height:36px;border-radius:50%;background:#fff;display:inline-grid;place-items:center;box-shadow:0 2px 0 #f0cfd5;font-size:14px;margin-left:8px;cursor:pointer}
/* 对话卡片 */
.card{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);width:min(780px,92%);background:#fff;border-radius:22px;padding:26px 30px 22px;box-shadow:0 4px 0 #f0cfd5;cursor:pointer;min-height:130px}
.name{position:absolute;left:24px;top:-17px;background:#ec7f95;color:#fff;border-radius:999px;padding:5px 20px;font-size:16px;font-weight:600;letter-spacing:.06em}
.text{font-size:clamp(16px,1.9vw,20px);line-height:1.85}
.next{position:absolute;right:20px;bottom:12px;color:#ec7f95;font-size:14px}
.choices{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:14px}
.ch{display:flex;align-items:center;gap:14px;width:min(560px,86%);background:#fff;border:0;border-radius:18px;padding:14px 20px;font:inherit;font-size:18px;color:#5a4048;text-align:left;cursor:pointer;box-shadow:0 4px 0 #f0cfd5;transition:transform .12s}
.ch em{flex:none;width:28px;height:28px;border-radius:50%;background:#fbd6dd;color:#d4566f;font-style:normal;display:grid;place-items:center;font-size:14px;font-weight:700}
.ch:hover{transform:translateY(-2px);background:#fff7f8}
.ch:active{transform:translateY(2px);box-shadow:0 1px 0 #f0cfd5}
.back{position:fixed;left:16px;top:62px;font:13px sans-serif;color:#b0707c;text-decoration:none;z-index:9;background:#fff;padding:3px 10px;border-radius:99px}
</style></head><body>
<div class="stage" id="stage"><img id="face">
 <div class="top"><div class="pill" id="chap"></div>
  <div style="display:flex;align-items:center"><div class="pill love">♥ 好感<div class="bar"><i id="bar"></i></div></div><span class="round">⏩</span><span class="round">☰</span></div></div>
 <div class="choices" id="choices"></div>
 <div class="card" id="card"><div class="name" id="name"></div><div class="text" id="text"></div><div class="next">▼</div></div>
</div>
<a class="back" href="index.html">← 返回选择</a>
<script src="story.js"></script>
<script>
const S=STORY,$=id=>document.getElementById(id);
$('stage').style.backgroundImage=`url(${S.bg})`;$('chap').textContent=S.chapter;
let opts=null;
const vn=createVN({
 face:s=>$('face').src=s,
 line:l=>{$('name').textContent=l.speaker;$('name').style.display=l.speaker?'block':'none';$('text').textContent=l.text},
 choices:o=>{opts=o;const c=$('choices');c.innerHTML='';$('card').style.visibility=o?'hidden':'visible';
  if(o)o.forEach((x,i)=>{const b=document.createElement('button');b.className='ch';b.innerHTML='<em>'+'ABC'[i]+'</em>';b.append(x.t);b.onclick=()=>vn.choose(i,opts);c.appendChild(b)})},
 aff:n=>$('bar').style.width=Math.min(n*16,100)+'%'
});
$('card').onclick=()=>vn.next();vn.start();
</script></body></html>
