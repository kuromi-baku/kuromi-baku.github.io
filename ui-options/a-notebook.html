<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案A・手帐拼贴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{height:100%;overflow:hidden;background:#e9dfca;font-family:'Hanzi Pen SC','Kaiti SC','STKaiti',serif;color:#3b2f27}
.desk{position:fixed;inset:0;background:#e9dfca;background-image:radial-gradient(#d3c6aa 1px,transparent 1px);background-size:18px 18px;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
/* 一张贴在手帐上的照片 */
.photo{position:relative;height:100%;aspect-ratio:16/10;max-width:100%;background:#fffdf6;padding:14px 14px 56px;box-shadow:2px 4px 0 rgba(90,70,40,.18);transform:rotate(-.6deg)}
.scene{position:relative;width:100%;height:100%;overflow:hidden;background:#000 center/cover}
.scene img{position:absolute;bottom:-2%;left:50%;transform:translateX(-50%);height:96%;pointer-events:none}
.tape{position:absolute;width:110px;height:28px;background:rgba(236,200,120,.72);top:-12px;left:40px;transform:rotate(-5deg)}
.tape.r{left:auto;right:50px;transform:rotate(4deg);background:rgba(200,150,160,.65)}
.cap{position:absolute;left:20px;bottom:14px;font-size:20px}
.aff{position:absolute;right:22px;bottom:12px;font-size:22px;color:#c4566b;letter-spacing:3px}
/* 便签：对话 */
.note{position:absolute;left:50%;bottom:7%;width:min(660px,64%);transform:translateX(-50%) rotate(.8deg);background:#fff9e3;padding:16px 26px 20px;
 background-image:repeating-linear-gradient(transparent 0 31px,#e3d6a8 31px 32px);box-shadow:2px 3px 0 rgba(90,70,40,.2);cursor:pointer;line-height:32px;font-size:21px;min-height:92px}
.note:before{content:"";position:absolute;width:70px;height:22px;background:rgba(160,190,170,.7);top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg)}
.who{display:inline-block;background:#c4566b;color:#fff;font-size:16px;line-height:22px;padding:0 10px;margin-right:8px;transform:rotate(-2deg)}
.hint{position:absolute;right:14px;bottom:2px;font-size:14px;color:#a8946c;line-height:20px}
/* 小纸条：选项 */
.choices{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;align-items:center;gap:14px}
.ch{width:min(520px,70%);background:#fffdf6;border:0;padding:12px 20px;font:inherit;font-size:20px;color:#3b2f27;cursor:pointer;box-shadow:2px 3px 0 rgba(90,70,40,.22);transition:transform .15s}
.ch:nth-child(1){transform:rotate(-1.2deg)}.ch:nth-child(2){transform:rotate(.9deg)}.ch:nth-child(3){transform:rotate(-.5deg)}
.ch:hover{transform:rotate(0) scale(1.03);background:#fff1b8}
.back{position:fixed;left:14px;top:10px;font:14px sans-serif;color:#7a6a4c;text-decoration:none;z-index:9}
</style></head><body>
<a class="back" href="index.html">← 返回选择</a>
<div class="desk"><div class="photo">
 <div class="tape"></div><div class="tape r"></div>
 <div class="scene" id="scene"><img id="face">
  <div class="choices" id="choices"></div>
  <div class="note" id="note"><span class="who" id="who"></span><span id="text"></span><span class="hint">點一下 ▸</span></div>
 </div>
 <div class="cap" id="cap"></div><div class="aff" id="aff">♡♡♡♡♡</div>
</div></div>
<script src="story.js"></script>
<script>
const S=STORY,$=id=>document.getElementById(id);
$('scene').style.backgroundImage=`url(${S.bg})`;$('cap').textContent='— '+S.chapter;
let opts=null;
const vn=createVN({
 face:s=>$('face').src=s,
 line:l=>{$('who').textContent=l.speaker;$('who').style.display=l.speaker?'inline-block':'none';$('text').textContent=l.text},
 choices:o=>{opts=o;const c=$('choices');c.innerHTML='';$('note').style.visibility=o?'hidden':'visible';
  if(o)o.forEach((x,i)=>{const b=document.createElement('button');b.className='ch';b.textContent=x.t;b.onclick=()=>vn.choose(i,opts);c.appendChild(b)})},
 aff:(n)=>{$('aff').textContent='♥'.repeat(Math.min(n,5))+'♡'.repeat(5-Math.min(n,5))}
});
$('note').onclick=()=>vn.next();vn.start();
</script></body></html>
